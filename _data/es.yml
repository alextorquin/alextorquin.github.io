  - title: Proyectos Destacados
    layout: list
    content:
      - layout: top-middle
        title: Migración de plataforma de negocio (Enerxe / UDESA)
        sub_title: Febrero 2023 - Junio 2024
        description: |
          **Contexto y rol:** CIO de Enerxe. Coordinación y supervisión de la migración para la distribuidora eléctrica UDESA.

          **Reto:** sustituir la plataforma que soporta inventario, contratos, abonados de red, *switching*, lectura de contadores y facturación de peajes (el volumen principal de facturación de la empresa) sin penalizar la facturación ni la relación con clientes.

          **Solución:** traslación de datos entre bases de datos, adaptación de procesos a la nueva plataforma e instalación de un FTP para el intercambio de ficheros con comercializadoras según los procedimientos de operación del sistema eléctrico, con accesos individuales por comercializadora.

          **Impacto:** plataforma de negocio completa migrada en 17 meses.

      - layout: top-middle
        title: API de integración entre proveedores (Enerxe)
        sub_title: Febrero 2023 - Diciembre 2023
        description: |
          **Contexto y rol:** lead del proyecto y supervisión desde la dirección TIC.

          **Reto:** la información de negocio estaba repartida entre aplicaciones de varios proveedores en producción, sin una vía estándar para consultarla ni integrarla con terceros.

          **Solución:** definición y exigencia a cada proveedor de REST APIs sobre su plataforma; supervisión del desarrollo y de las integraciones entre proveedores y con terceros.

          **Impacto:** 8 sistemas integrados, entre APIs de terceros, FTP y bases de datos.

      - layout: top-middle
        title: Concentrador Secundario de medidas (ITELSIS, cliente UDESA)
        sub_title: Febrero 2014 - Actualidad
        description: |
          **Contexto y rol:** desarrollador principal y responsable de homologación de software.

          **Reto:** cumplir la legislación vigente y los requisitos de Red Eléctrica de España para el envío de medidas eléctricas de una distribuidora al Concentrador Principal.

          **Solución:** middleware con arquitectura SOA basada en ESB, data warehouse y procesos comunes de tratamiento de medidas, y capa de comunicaciones SOAP con el Concentrador Principal de REE. Estudio de Big Data y Spring XD para la captación de medidas.

          **Impacto:** software homologado por Red Eléctrica de España, con una arquitectura que permite añadir nuevos servicios sobre el mismo data warehouse.

      - layout: top-middle
        title: SISMORED
        link: http://www.itelsis.com
        sub_title: Febrero 2017 - Actualidad
        description: |
          **Contexto y rol:** diseño e implementación para varios clientes del sector eléctrico.

          **Reto:** conocer el estado de la red eléctrica tras la modificación o perturbación de alguno de sus elementos.

          **Solución:** modelo de la red como grafo con algoritmos de propagación sobre el SCADA Wonderware, evolucionado a plataforma propietaria con capa de visualización web. Tecnologías: Python, Django, Angular.

          **Impacto:** plataforma en uso continuado desde 2017.

      - layout: top-middle
        title: CRM a medida (Enerxe / UDESA)
        sub_title: Diciembre 2023 - Actualidad
        description: |
          Selección de proveedor y gestión del proyecto de una web a medida (www.udesa.es) con área de clientes y portal de administración para las solicitudes de abonados de red según la normativa de la CNMC.

      - layout: top-middle
        title: SMARNET (I+D ITELSIS)
        sub_title: Septiembre 2016 - Abril 2021
        description: |
          Comunicaciones entre sensores embarcados y plataforma de alertas sobre broker FIWARE (REST/NGSI), implementadas en BeagleBone Black. Tecnologías: Java, Python, Spring, MongoDB.

      - layout: top-middle
        title: AQUASERS (I+D ITELSIS)
        sub_title: Enero 2017 - Abril 2021
        description: |
          Firmware en BeagleBone Black para recuperar datos de un espectrómetro SERS, con plataforma cloud y aplicación web de consulta. Tecnologías: Java, Python, Spring, MongoDB.

