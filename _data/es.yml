content:
  - title: Experiencia
    layout: list
    content:
      - layout: left
        title: Responsable TIC y Sistemas | CIO
        link: https://www.enerxe.es
        sub_title: Enerxe
        caption: Abril 2021 - Actualidad
        description: |
          Dirección del departamento TIC, diseño de arquitectura hardware/software, coordinación de planes estratégicos con equipo directivo, supervisión de ciberseguridad y gestión de proyectos de desarrollo para el sector eléctrico.

          Creación integral del departamento IT y su gobernanza técnica para la distribución eléctrica de UDESA y la propia Enerxe. Cumplimiento normativo ante la CNMC mediante la digitalización de procesos de medida y facturación.

          Centralización de datos con proyectos de ingesta y modelización (datalake, datahub, Airflow, FastAPI). Implantación de soluciones Microsoft 365, Power BI, Copilot para M365. Analítica de datos con Power BI. Automatización de tareas con Python y shell-scripting.

          Proyectos destacados: migración de plataforma de negocio (inventario, contratos, facturación), diseño y supervisión de API REST de integración con proveedores, desarrollo de CRM a medida, y librerías SCADA SISMORED.

