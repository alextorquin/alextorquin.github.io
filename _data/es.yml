about_content: |
  Licenciado y Máster en Física, con un Máster en Project Management. Amplia experiencia en programación y tecnologías TIC, así como en análisis y diseño de soluciones informáticas. Versátil y con gran capacidad de adaptación y aprendizaje.

  Experiencia en metodologías ágiles de desarrollo y coordinación de equipos. Más de 11 años trabajando en análisis, diseño UML y programación Java/J2EE, más de 7 en Python y más de 5 en servicios REST.

  Habilidades principales: <mark>Java/J2EE</mark>, <mark>Python</mark>, <mark>Django</mark>, <mark>Angular</mark>, <mark>Spring</mark>, <mark>Power BI</mark>, <mark>MongoDB</mark>

