about_title: Sobre Mí
about_content: |
  Me formé como físico (Licenciatura en Física, con especialidad en Partículas y Astrofísica, y Máster en Física Aplicada) y entré en el software en 2006 con unas prácticas en la Agencia Espacial Europea. De la física conservo un hábito: modelar el problema antes de resolverlo.

  Durante quince años diseñé y desarrollé software empresarial en Java y Python para clientes como Inditex, Grupo Santander, la Xunta de Galicia y distribuidoras eléctricas. En ITELSIS fui arquitecto y desarrollador principal del middleware de medidas homologado por Red Eléctrica de España.

  Desde 2021 dirijo el área TIC de Enerxe: creé el departamento desde cero, gestiono presupuesto, proveedores y ciberseguridad, y aseguro el cumplimiento normativo de la distribución eléctrica de UDESA. Completo la visión técnica con un Máster en Project Management, PRINCE2 Foundation y PMI-ACP.

  Habilidades principales: <mark>Gobierno TI</mark>, <mark>Arquitectura de software</mark>, <mark>Java/J2EE</mark>, <mark>Python</mark>, <mark>APIs REST/SOAP</mark>, <mark>Power BI</mark>, <mark>Datalake / Airflow</mark>

