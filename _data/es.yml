          Desarrollador principal y responsable de homologación de software con Red Eléctrica Española. Diseño de middleware para distribuidoras eléctricas, desarrollo de comunicaciones IoT con FIWARE, y firmware para BeagleBone Black con recuperación de datos espectroscópicos.

