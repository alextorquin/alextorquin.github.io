about_title: About Me
about_content: |
  I trained as a physicist (Degree in Physics, specialising in Particle Physics and Astrophysics, plus a Master's in Applied Physics) and moved into software in 2006 with an internship at the European Space Agency. From physics I kept one habit: model the problem before solving it.

  For fifteen years I designed and built enterprise software in Java and Python for clients such as Inditex, Grupo Santander, the Xunta de Galicia and electricity distributors. At ITELSIS I was architect and lead developer of the metering middleware certified by Red Eléctrica de España.

  Since 2021 I have led IT at Enerxe: I built the department from scratch, manage budget, vendors and cybersecurity, and ensure regulatory compliance for UDESA's electricity distribution. I complement the technical view with a Master's in Project Management, PRINCE2 Foundation and PMI-ACP.

  Key skills: <mark>IT governance</mark>, <mark>Software architecture</mark>, <mark>Java/J2EE</mark>, <mark>Python</mark>, <mark>REST/SOAP APIs</mark>, <mark>Power BI</mark>, <mark>Datalake / Airflow</mark>

