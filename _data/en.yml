  - title: Featured Projects
    layout: list
    content:
      - layout: top-middle
        title: Business Platform Migration (Enerxe / UDESA)
        sub_title: February 2023 - June 2024
        description: |
          **Context and role:** CIO at Enerxe. Coordinated and supervised the migration for the electricity distributor UDESA.

          **Challenge:** replace the platform behind inventory, contracts, network subscribers, *switching*, meter reading and network-toll billing (the company's main billing volume) without disrupting billing or customer relations.

          **Solution:** data transfer between databases, adaptation of processes to the new platform, and an FTP service for file exchange with energy retailers as required by the electricity system operating procedures, with individual access per retailer.

          **Impact:** full business platform migrated in 17 months. [complete metric: number of contracts/subscribers migrated, billing incidents]

      - layout: top-middle
        title: Vendor Integration API (Enerxe)
        sub_title: February 2023 - December 2023
        description: |
          **Context and role:** project lead and supervision from the IT management.

          **Challenge:** business data was spread across applications from several vendors in production, with no standard way to query it or integrate it with third parties.

          **Solution:** defined and required REST APIs from each vendor on their platform; supervised the development and the integrations between vendors and with third parties.

          **Impact:** [complete metric: number of systems integrated, manual processes removed]

      - layout: top-middle
        title: Secondary Metering Concentrator (ITELSIS, client UDESA)
        sub_title: February 2014 - Present
        description: |
          **Context and role:** lead developer and software certification owner.

          **Challenge:** comply with current legislation and Red Eléctrica de España requirements for sending a distributor's electricity metering data to the Primary Concentrator.

          **Solution:** middleware with an ESB-based SOA architecture, a shared data warehouse and common metering processes, and a SOAP communication layer with REE's Primary Concentrator. Evaluation of Big Data and Spring XD for metering data capture.

          **Impact:** software certified by Red Eléctrica de España, with an architecture that allows new services on the same data warehouse.

      - layout: top-middle
        title: SISMORED
        link: http://www.itelsis.com
        sub_title: February 2017 - Present
        description: |
          **Context and role:** design and implementation for several electricity-sector clients.

          **Challenge:** determine the state of the power grid after one or more of its elements are modified or disturbed.

          **Solution:** grid modelled as a graph with propagation algorithms on the Wonderware SCADA, evolved into a proprietary platform with a web visualisation layer. Technologies: Python, Django, Angular.

          **Impact:** [complete metric: number of clients, size of grid modelled]

      - layout: top-middle
        title: Custom CRM (Enerxe / UDESA)
        sub_title: December 2023 - Present
        description: |
          Vendor selection and project management for a custom website (www.udesa.es) with a customer area and an admin portal for network subscriber requests under CNMC regulations.

      - layout: top-middle
        title: SMARNET (R&D ITELSIS)
        sub_title: September 2016 - April 2021
